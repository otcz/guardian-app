<div class="page-wrap">
  <p-card class="card">
    <div class="header"><h2 class="title">Asignar menú a un rol</h2></div>
    <div class="body">
      <div class="form-grid">
        <!-- Selector de rol -->
        <div class="field">
          <label>Selector de rol</label>
          <p-dropdown [options]="roles" optionValue="id" [(ngModel)]="rolId" name="rolId" placeholder="Seleccione rol" [filter]="false" [showClear]="true" (onChange)="onRolChange()">
            <ng-template pTemplate="selectedItem" let-value>
              <ng-container *ngIf="value as id">
                <span *ngIf="roleById.get(id) as r">{{ r.nombre }}<span class="text-muted" *ngIf="r.orgNombre">-{{ r.orgNombre }}</span></span>
              </ng-container>
            </ng-template>
            <ng-template pTemplate="item" let-r>
              <span>{{ r.nombre }}<span class="text-muted" *ngIf="r.orgNombre">-{{ r.orgNombre }}</span></span>
            </ng-template>
          </p-dropdown>
        </div>
        <!-- Buscar rol local -->
        <div class="field">
          <label>Buscar rol</label>
          <input pInputText type="text" [(ngModel)]="roleQuery" (ngModelChange)="onRoleQueryChange()" placeholder="Buscar rol (local)" />
        </div>
        <!-- Buscar opción -->
        <div class="field">
          <label>Buscar opción</label>
          <input pInputText type="text" [(ngModel)]="query" (ngModelChange)="applyFilter()" placeholder="Filtrar por nombre o ruta" />
        </div>
      </div>

      <!-- Resumen y estados -->
      <div class="meta-row fs-xs text-muted" *ngIf="orgId && rolId">
        <p-tag value="Total: {{ allOptions.length }}" severity="secondary" class="mr-1"></p-tag>
        <p-tag value="Filtradas: {{ filteredOptions.length }}" severity="info" class="mr-1"></p-tag>
        <p-tag value="Asignadas: {{ totalAssigned }}" severity="success" class="mr-1"></p-tag>
        <p-tag value="Seleccionadas: {{ totalSelected }}" severity="warn"></p-tag>
      </div>

      <p *ngIf="errorMsg" class="p-error mb-sm fs-sm">{{ errorMsg }}</p>

      <div class="list-toolbar" *ngIf="tableRows.length">
        <div class="left">
          <p-checkbox [binary]="true" [ngModel]="allFilteredSelected()" (ngModelChange)="onToggleSelectAllFiltered($event)"></p-checkbox>
          <span class="label">Seleccionar todo lo visible (solo activos)</span>
        </div>
        <div class="right">
          <span class="text-muted mr-1">{{ tableRows.length }} opciones visibles</span>
          <span class="toolbar-divider"></span>
          <span class="ml-2 mr-1">Solo activos</span>
          <p-checkbox [binary]="true" [(ngModel)]="onlyActive" (ngModelChange)="applyFilter()"></p-checkbox>
          <span class="ml-3 mr-1">Solo menús</span>
          <p-checkbox [binary]="true" [(ngModel)]="onlyMenus" (ngModelChange)="applyFilter()"></p-checkbox>
        </div>
      </div>

      <div class="scroll-area">
        <div class="menu-groups" *ngIf="tableRows.length; else emptyState">
          <div class="menu-group" *ngFor="let g of tableRows" [ngClass]="{'is-root': g.nivel===0}">
            <ng-container *ngIf="g.nivel === 0">
              <div class="menu-header" (click)="toggleExpand(g.id)">
                <div class="left" style="display:flex; align-items:center; gap:10px;">
                  <i class="pi pi-fw" [ngClass]="expanded.has(g.id) ? 'pi-chevron-down' : 'pi-chevron-right'"></i>
                  <p-checkbox [binary]="true"
                              [ngModel]="groupAllSelectedById(g.id)"
                              [indeterminate]="groupSomeSelectedById(g.id)"
                              (click)="$event.stopPropagation()"
                              (onChange)="onToggleGroup(g.id, $event.checked)"></p-checkbox>
                  <div style="display:flex; align-items:center; gap:8px; font-weight:700;">
                    <i *ngIf="g.icono" class="pi pi-fw" [ngClass]="'pi-' + g.icono"></i>
                    <span>{{ g.nombre }}</span>
                  </div>
                </div>
                <div class="right" style="display:flex; align-items:center; gap:6px;">
                  <p-tag [value]="'MENÚ'" severity="info"></p-tag>
                  <p-tag [value]="(groupRows(g.id).length - 1) + ' ítems'" severity="secondary"></p-tag>
                  <p-tag [value]="groupSelectedCount(g.id) + ' sel'" severity="success"></p-tag>
                  <p-tag [value]="g.activo===false ? 'INACTIVO' : 'ACTIVO'" [severity]="g.activo===false ? 'danger' : 'success'"></p-tag>
                </div>
              </div>
              <ul class="menu-items" *ngIf="expanded.has(g.id)">
                <li class="menu-item" *ngFor="let r of groupRows(g.id)" [ngClass]="{'is-header': r.id===g.id}">
                  <ng-container *ngIf="r.id !== g.id">
                    <div class="item-row" [style.padding-left.px]="r.nivel * 20">
                      <p-checkbox [binary]="true" [ngModel]="selectedIds.has(r.id)" (ngModelChange)="toggleOne(r.id, $event)" [disabled]="r.activo === false"></p-checkbox>
                      <div style="display:flex; align-items:center; gap:6px;">
                        <i *ngIf="r.icono" class="pi pi-fw" [ngClass]="'pi-' + r.icono"></i>
                        <span [style.font-weight]="(r.tipo || '').toUpperCase()==='MENU' ? 600 : 400">{{ r.nombre }}</span>
                      </div>
                      <span class="truncate text-muted" [title]="r.ruta || ''" style="margin-left:auto; margin-right:8px;">{{ r.ruta }}</span>
                      <p-tag [value]="(r.tipo || '').toUpperCase()" [severity]="(r.tipo || '').toUpperCase()==='MENU' ? 'info' : 'secondary'"></p-tag>
                      <p-tag [value]="r.activo===false ? 'INACTIVO' : 'ACTIVO'" [severity]="r.activo===false ? 'danger' : 'success'"></p-tag>
                    </div>
                  </ng-container>
                </li>
              </ul>
            </ng-container>
          </div>
        </div>
        <ng-template #emptyState>
          <div class="empty text-muted">
            <div>Sin datos</div>
            <button pButton type="button" icon="pi pi-database" label="Crear catálogo" class="p-button-text" (click)="seedNow()" *ngIf="orgId && !loading"></button>
          </div>
        </ng-template>
      </div>
    </div>

    <div class="actions">
      <button pButton type="button" label="Guardar" icon="pi pi-save" (click)="save()" [disabled]="!rolId || saving || !hasChanges"></button>
      <button pButton type="button" class="p-button-text" label="Revertir cambios" icon="pi pi-refresh" (click)="revert()" [disabled]="!hasChanges"></button>
      <button pButton type="button" class="p-button-text" label="Cancelar" icon="pi pi-times" (click)="resetData()"></button>
    </div>
  </p-card>
</div>
