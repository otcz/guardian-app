<div class="list-wrapper">

  <div class="list-header flex ai-center gap-sm">
    <div class="titles">
      <h2>Roles</h2>
    </div>
    <span class="spacer"></span>
    <div class="list-actions flex ai-center gap-sm flex-wrap">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Filtrar por nombre o descripción" [(ngModel)]="filter" (ngModelChange)="applyFilter()" class="w-260" />
      </span>
      <button pButton type="button" label="Nuevo" icon="pi pi-plus" (click)="startAdd()" [disabled]="adding || !!editingId" class="p-button-success"></button>
      <button pButton type="button" label="Recargar" icon="pi pi-refresh" (click)="load()" [disabled]="loading"></button>
    </div>
  </div>

  <!-- Switch global de propagación de roles a hijos -->
  <div class="org-roles-propagation" *ngIf="orgId">
    <label class="flex ai-center gap-xs">
      <span class="switch-wrap">
        <p-inputSwitch
          [ngModel]="propagarRolesAHijos"
          [style.pointer-events]="'none'"
          [attr.tabindex]="-1"
          [pTooltip]="'Permitir que los roles de esta organización se hereden a organizaciones y secciones hijas'"
          tooltipPosition="top">
        </p-inputSwitch>
        <button type="button" class="switch-overlay"
                (click)="onTogglePropagarRolesAHijos(!propagarRolesAHijos)"
                [disabled]="togglingPropagar || loading"
                [pTooltip]="'Permitir que los roles de esta organización se hereden a organizaciones y secciones hijas'"
                tooltipPosition="top"></button>
      </span>
      <span>Permitir que los roles de esta organización se hereden a organizaciones y secciones hijas</span>
    </label>
  </div>

  <p *ngIf="error" class="p-error mb-sm fs-sm">{{error}}</p>
  <p *ngIf="!loading && !error && filtered.length===0" class="mb-sm fs-sm text-muted">No hay roles.</p>

  <div *ngIf="rows.length>0" class="table-shell">
    <div class="table-meta fs-xs text-muted mb-xs">Mostrando {{filtered.length}} de {{items.length}}</div>
    <p-table [value]="rows" [loading]="loading" styleClass="p-datatable-sm table-hover" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th class="w-70">#</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th class="w-120">Estado</th>
          <th class="w-150">Visible Hijos</th>
          <th class="w-220 text-center">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr [class.flash]="row.id === flashRowId">
          <td>{{ i + 1 }}</td>

          <td>
            <ng-container *ngIf="adding && row.id === ''; else notAddingName">
              <input pInputText [(ngModel)]="newDraft.nombre" placeholder="Nombre del rol" class="w-100" />
            </ng-container>
            <ng-template #notAddingName>
              <ng-container *ngIf="editingId === row.id; else viewName">
                <input pInputText [ngModel]="editDraft?.nombre" (ngModelChange)="onEditChange('nombre', $event)" placeholder="Nombre del rol" class="w-100" />
              </ng-container>
              <ng-template #viewName>
                <ng-container *ngIf="displayParts(row).post as orgPart; else onlyMain">
                  <span>{{ displayParts(row).pre }}-<span class="org-muted">{{ orgPart }}</span></span>
                </ng-container>
                <ng-template #onlyMain>{{ displayParts(row).pre }}</ng-template>
              </ng-template>
            </ng-template>
          </td>

          <td>
            <ng-container *ngIf="adding && row.id === ''; else notAddingDesc">
              <input pInputText [(ngModel)]="newDraft.descripcion" placeholder="Descripción (opcional)" class="w-100" maxlength="160" />
            </ng-container>
            <ng-template #notAddingDesc>
              <ng-container *ngIf="editingId === row.id; else viewDesc">
                <input pInputText [ngModel]="editDraft?.descripcion" (ngModelChange)="onEditChange('descripcion', $event)" placeholder="Descripción (opcional)" class="w-100" maxlength="160" />
              </ng-container>
              <ng-template #viewDesc>
                <span class="fs-sm opacity-85">{{ row.descripcion || '-' }}</span>
              </ng-template>
            </ng-template>
          </td>

          <td>
            <div class="flex ai-center gap-xs">
              <span class="switch-wrap">
                <p-inputSwitch
                  [ngModel]="row.activo != null ? row.activo : ['ACTIVO'].includes((row.estado||'').toUpperCase())"
                  [style.pointer-events]="'none'"
                  [attr.tabindex]="-1">
                </p-inputSwitch>
                <button type="button" class="switch-overlay"
                        (click)="onToggleEstado(row, !(row.activo != null ? row.activo : ['ACTIVO'].includes((row.estado||'').toUpperCase())))"
                        [disabled]="saving || (adding && row.id==='') || !canToggle(row) || isToggling(row, 'estado')"
                        [pTooltip]="!canToggle(row) ? 'No tienes permiso para cambiar este rol' : 'Cambiar estado'"
                        tooltipPosition="top"></button>
              </span>
              <p-tag [severity]="(row.activo != null ? row.activo : ['ACTIVO'].includes((row.estado||'').toUpperCase())) ? 'success' : 'danger'" [value]="row.estado || (row.activo ? 'ACTIVO' : 'INACTIVO')"></p-tag>
            </div>
          </td>

          <td>
            <div class="flex ai-center gap-xs">
              <span class="switch-wrap">
                <p-inputSwitch
                  [ngModel]="!!row.visibleParaHijos"
                  [style.pointer-events]="'none'"
                  [attr.tabindex]="-1">
                </p-inputSwitch>
                <button type="button" class="switch-overlay"
                        (click)="onToggleVisibleParaHijos(row, !row.visibleParaHijos)"
                        [disabled]="saving || (adding && row.id==='') || !canToggleVisible(row) || isToggling(row, 'visible')"
                        [pTooltip]="(adding && row.id==='') ? 'Guarda el rol para poder cambiar la visibilidad para hijos' : (!canToggleVisible(row) ? 'No tienes permiso para cambiar visibilidad de este rol' : 'Cambiar visibilidad para hijos')"
                        tooltipPosition="top"></button>
              </span>
            </div>
          </td>

          <td>
            <div class="flex ai-center gap-xs">
              <ng-container *ngIf="adding && row.id === ''">
                <button pButton type="button" icon="pi pi-check" class="p-button-rounded p-button-success"
                        (click)="saveAdd()"
                        [disabled]="saving || !(newDraft.nombre && newDraft.nombre.trim().length >= 3)"
                        pTooltip="Guardar rol" tooltipPosition="top"></button>
                <button pButton type="button" icon="pi pi-times" class="p-button-rounded p-button-secondary"
                        (click)="cancelAdd()"
                        [disabled]="saving"
                        pTooltip="Cancelar" tooltipPosition="top"></button>
              </ng-container>

              <ng-container *ngIf="!adding && editingId === row.id">
                <button pButton type="button" icon="pi pi-check" class="p-button-rounded p-button-success"
                        (click)="saveEdit()"
                        [disabled]="saving || !editDraft || !(editDraft.nombre && editDraft.nombre.trim().length >= 3)"
                        pTooltip="Guardar cambios" tooltipPosition="top"></button>
                <button pButton type="button" icon="pi pi-times" class="p-button-rounded p-button-secondary"
                        (click)="cancelEdit()"
                        [disabled]="saving"
                        pTooltip="Cancelar edición" tooltipPosition="top"></button>
              </ng-container>

              <ng-container *ngIf="!adding && editingId !== row.id">
                <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text" (click)="startEdit(row)" [disabled]="saving" pTooltip="EDITAR" tooltipPosition="top"></button>
                <button pButton type="button" icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger" (click)="remove(row)" [disabled]="saving" pTooltip="ELIMINAR" tooltipPosition="top"></button>
              </ng-container>
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="6" class="text-center fs-sm text-muted">Sin datos</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
