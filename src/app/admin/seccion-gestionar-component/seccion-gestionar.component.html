<div class="page-container">
  <p-card class="modern-card">
    <!-- Header con gradiente -->
    <ng-template pTemplate="header">
      <div class="card-header">
        <div class="header-content">
          <i class="pi pi-cog header-icon"></i>
          <div class="header-text">
            <h2>Gestionar Sección</h2>
            <p class="subtitle" *ngIf="seccion">
              <i class="pi pi-th-large"></i>
              <span>{{ seccion.nombre }}</span>
              <span class="status-badge" [class.active]="['ACTIVA','ACTIVO'].includes((seccion.estado||'').toUpperCase())"
                    [class.inactive]="!['ACTIVA','ACTIVO'].includes((seccion.estado||'').toUpperCase())">
                <i class="pi" [ngClass]="['ACTIVA','ACTIVO'].includes((seccion.estado||'').toUpperCase()) ? 'pi-check-circle' : 'pi-times-circle'"></i>
                {{ seccion.estado || 'ACTIVA' }}
              </span>
            </p>
          </div>
        </div>
        <button
          pButton
          type="button"
          icon="pi pi-arrow-left"
          label="Volver"
          class="back-button"
          (click)="volver()"
          pTooltip="Volver al listado"
          tooltipPosition="top">
        </button>
      </div>
    </ng-template>

    <div class="card-body">
      <!-- Información de la sección -->
      <div class="info-section" *ngIf="seccion">
        <h3 class="section-title">
          <i class="pi pi-info-circle"></i>
          Información de la Sección
        </h3>

        <div class="info-grid">
          <div class="info-card">
            <div class="info-icon">
              <i class="pi pi-tag"></i>
            </div>
            <div class="info-content">
              <span class="info-label">Nombre</span>
              <strong>{{ seccion.nombre }}</strong>
            </div>
          </div>

          <div class="info-card" *ngIf="seccion.descripcion">
            <div class="info-icon">
              <i class="pi pi-align-left"></i>
            </div>
            <div class="info-content">
              <span class="info-label">Descripción</span>
              <strong>{{ seccion.descripcion }}</strong>
            </div>
          </div>

          <div class="info-card">
            <div class="info-icon">
              <i class="pi pi-power-off"></i>
            </div>
            <div class="info-content">
              <span class="info-label">Estado</span>
              <p-tag
                [value]="seccion.estado || 'ACTIVA'"
                [severity]="['ACTIVA','ACTIVO'].includes((seccion.estado||'').toUpperCase()) ? 'success' : 'danger'">
              </p-tag>
            </div>
          </div>

          <div class="info-card" *ngIf="seccion.autonomiaConfigurada !== undefined">
            <div class="info-icon">
              <i class="pi pi-unlock"></i>
            </div>
            <div class="info-content">
              <span class="info-label">Autonomía</span>
              <p-tag
                [value]="seccion.autonomiaConfigurada ? 'CONFIGURADA' : 'NO CONFIGURADA'"
                [severity]="seccion.autonomiaConfigurada ? 'success' : 'warn'">
              </p-tag>
            </div>
          </div>
        </div>
      </div>

      <!-- Acciones disponibles -->
      <div class="actions-section">
        <h3 class="section-title">
          <i class="pi pi-bolt"></i>
          Acciones Disponibles
        </h3>

        <div class="actions-grid">
          <!-- Gestión de Lugares -->
          <div class="action-card lugares-card">
            <div class="action-header">
              <div class="action-icon">
                <i class="pi pi-map-marker"></i>
              </div>
              <div class="action-info">
                <h4>Gestión de Lugares</h4>
                <p>Administra los lugares de esta sección</p>
              </div>
            </div>
            <div class="action-buttons">
              <button
                pButton
                type="button"
                label="Crear Lugar"
                icon="pi pi-plus"
                class="p-button-success action-btn"
                (click)="crearLugar()"
                [disabled]="loading">
              </button>
              <button
                pButton
                type="button"
                label="Listar Lugares"
                icon="pi pi-list"
                class="p-button-outlined action-btn"
                (click)="listarLugares()"
                [disabled]="loading">
              </button>
            </div>
          </div>

          <!-- Más acciones se pueden agregar aquí -->
          <!--
          <div class="action-card usuarios-card">
            <div class="action-header">
              <div class="action-icon">
                <i class="pi pi-users"></i>
              </div>
              <div class="action-info">
                <h4>Gestión de Usuarios</h4>
                <p>Administra los usuarios de esta sección</p>
              </div>
            </div>
            <div class="action-buttons">
              <button pButton type="button" label="Ver Usuarios" icon="pi pi-eye" class="p-button-info action-btn"></button>
            </div>
          </div>
          -->
        </div>
      </div>

      <!-- Estado de carga -->
      <div class="loading-overlay" *ngIf="loading">
        <p-progressSpinner></p-progressSpinner>
        <p>Cargando información...</p>
      </div>
    </div>
  </p-card>
</div>
