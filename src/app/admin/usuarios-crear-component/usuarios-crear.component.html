<div class="page-wrap">
  <p-card class="card">
    <div class="header">
      <h2 class="title">Crear usuario</h2>
    </div>

    <div class="body">
      <!-- Chips de preview, sin alterar orden de campos del formulario -->
      <div class="meta-row" *ngIf="model.username || model.nombreCompleto || model.email">
        <p-chip icon="pi pi-id-card" [label]="model.username || 'USUARIO'" class="pill"></p-chip>
        <p-chip *ngIf="model.nombreCompleto" icon="pi pi-user" [label]="model.nombreCompleto" class="pill"></p-chip>
        <p-chip *ngIf="model.email" icon="pi pi-envelope" [label]="model.email" class="pill"></p-chip>
        <p-chip *ngIf="isSeccionRequerida && model.seccionId" icon="pi pi-sitemap" [label]="'Sección: ' + (seccionNombre || model.seccionId)" class="pill muted"></p-chip>
      </div>

      <form (ngSubmit)="onSubmit()" class="edit-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label>Username *</label>
            <input pInputText type="text" name="username" [(ngModel)]="model.username" required minlength="3" maxlength="64" appUppercase placeholder="USUARIO" />
          </div>

          <div class="field">
            <label>Nombre completo</label>
            <input pInputText type="text" name="nombreCompleto" [(ngModel)]="model.nombreCompleto" maxlength="120" appUppercase placeholder="Nombre y Apellido" />
          </div>

          <div class="field">
            <label>Email</label>
            <input pInputText type="email" name="email" [(ngModel)]="model.email" maxlength="160" placeholder="usuario@dominio.com" />
          </div>

          <div class="field">
            <label>Alcance</label>
            <p-dropdown [options]="scopeOptions" optionLabel="label" optionValue="value" [(ngModel)]="model.scopeNivel" name="scopeNivel" (onChange)="onScopeChange()"></p-dropdown>
          </div>

          <!-- Organización que va a administrar cuando alcance sea ORGANIZACION -->
          <div class="field" *ngIf="isAlcanceOrganizacion">
            <label>Organización que administrará *</label>
            <p-dropdown
              [options]="organizaciones"
              optionLabel="nombre"
              optionValue="id"
              [(ngModel)]="model.orgAdministradaId"
              name="orgAdministradaId"
              placeholder="Seleccione organización"
              (onChange)="onOrganizacionAdministradaChange()">
            </p-dropdown>
          </div>

          <!-- Selector de sección, solo cuando el alcance requiere sección -->
          <div class="field" *ngIf="isSeccionRequerida">
            <label>Sección</label>
            <ng-container *ngIf="!loading; else sectionsLoading">
              <p-dropdown [options]="secciones" optionLabel="nombre" optionValue="id" [(ngModel)]="model.seccionId" name="seccionId" placeholder="Seleccione sección"></p-dropdown>
            </ng-container>
          </div>

          <!-- Selector de roles: para SECCION va después de la sección; para ORGANIZACION va después de la organización -->
          <div class="field">
            <label>Rol</label>
            <p-dropdown
              [options]="rolesDisponibles"
              optionLabel="nombre"
              optionValue="id"
              [(ngModel)]="model.rolesIds"
              name="rolesIds"
              [showClear]="true"
              placeholder="Seleccione rol">
              <ng-template let-role pTemplate="item">
                <div class="role-option">
                  <span class="role-name">{{ role.nombre }}</span>
                  <span class="role-org" *ngIf="role.orgNombre">-org {{ role.orgNombre }}</span>
                </div>
              </ng-template>
              <ng-template let-role pTemplate="selectedItem">
                <div class="role-option">
                  <span class="role-name">{{ role?.nombre }}</span>
                  <span class="role-org" *ngIf="role?.orgNombre">-org {{ role.orgNombre }}</span>
                </div>
              </ng-template>
            </p-dropdown>
          </div>
        </div>

        <div class="actions">
          <button pButton type="submit" label="Crear" icon="pi pi-save" [disabled]="saving || (isSeccionRequerida && !model.seccionId) || (isAlcanceOrganizacion && !model.orgAdministradaId)"></button>
          <button pButton type="button" class="p-button-text" label="Limpiar" icon="pi pi-refresh" (click)="reset()" [disabled]="saving"></button>
          <button pButton type="button" class="p-button-text" label="Cancelar" icon="pi pi-times" [routerLink]="['/gestion-de-usuarios/listar-usuarios']" [disabled]="saving"></button>
          <span class="spacer"></span>
          <button pButton type="button" icon="pi pi-send" class="p-button-text" label="Invitar a la Sección" (click)="openInvite()"></button>
        </div>
      </form>

      <ng-template #sectionsLoading>
        <div class="skeletons">
          <p-skeleton width="100%" height="42px" [ngStyle]="{ 'margin-top': '4px' }"></p-skeleton>
        </div>
      </ng-template>
    </div>
  </p-card>

  <p-progressSpinner *ngIf="loading" styleClass="overlay-spinner"></p-progressSpinner>

  <app-section-invite-dialog [(visible)]="showInvite" [orgId]="orgId" [seccionId]="seccionIdForInvite"></app-section-invite-dialog>
</div>
