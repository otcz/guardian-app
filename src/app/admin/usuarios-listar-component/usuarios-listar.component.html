<div class="page-wrap">
  <p-card class="card">
    <div class="page-header">
      <h2>Usuarios</h2>
      <div class="tools">
        <input class="search-input" pInputText type="text" placeholder="Buscar por username, nombre, email o alcance..." [(ngModel)]="filter" (ngModelChange)="applyFilter()" />
        <button pButton type="button" label="Crear usuario" icon="pi pi-plus" [routerLink]="['/gestion-de-usuarios/crear-usuario']"></button>
      </div>
    </div>

    <div class="body">
      <p-table [value]="filtered"
               styleClass="full-height-table"
               [loading]="loading"
               [paginator]="true"
               [rows]="pageSize"
               [rowsPerPageOptions]="rowsOptions"
               [(first)]="first"
               [responsiveLayout]="'scroll'"
               [showCurrentPageReport]="true"
               currentPageReportTemplate="Mostrando {first}-{last} de {totalRecords}">
        <ng-template pTemplate="header">
          <tr>
            <th class="col-username">Username</th>
            <th class="col-org">Organización/Sección</th>
            <th class="col-roles">ROL(es)</th>
            <th class="col-phone">Teléfono</th>
            <th class="col-status">Estado</th>
            <th class="col-actions">Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-u>
          <tr>
            <td class="col-username">
              <div class="user-cell">
                <p-avatar icon="pi pi-user" shape="circle" size="large" [style]="{ background: 'var(--surface-100)', color: 'var(--text-color)' }"></p-avatar>
                <div class="meta">
                  <div class="top">{{ u.nombreCompleto || u.username }}</div>
                  <div class="sub">{{ u.username }}<span *ngIf="u.email"> · {{ u.email }}</span></div>
                </div>
              </div>
            </td>
            <td class="col-org">
              <div class="stack">
                <p-chip icon="pi pi-building" [label]="u.orgNombre || orgName || '-'" class="pill"></p-chip>
                <p-chip *ngIf="u.seccionNombre || u.seccionId" icon="pi pi-sitemap" [label]="u.seccionNombre || sectionName(u)" class="pill"></p-chip>
              </div>
            </td>
            <td class="col-roles">
              <ng-container *ngIf="rolesFor(u) as rs">
                <ng-container *ngIf="rs.length > 0; else noRoles">
                  <p-tag [value]="rs[0] | roleLabel" [severity]="rs[0] | roleSeverity"></p-tag>
                  <button *ngIf="rs.length > 1"
                          pButton type="button"
                          class="p-button-text p-button-sm ml-1"
                          [label]="'+' + (rs.length - 1)"
                          icon="pi pi-plus"
                          iconPos="left"
                          (click)="op.toggle($event)"></button>
                  <p-overlayPanel #op [dismissable]="true" [showCloseIcon]="true">
                    <div class="roles-overlay">
                      <div class="roles-title">Roles del usuario</div>
                      <div class="roles-list">
                        <p-tag *ngFor="let r of rs" [value]="r | roleLabel" [severity]="r | roleSeverity" class="mr-1 mb-1"></p-tag>
                      </div>
                    </div>
                  </p-overlayPanel>
                </ng-container>
                <ng-template #noRoles>
                  <p-tag [value]="'-' | roleLabel" [severity]="'-' | roleSeverity"></p-tag>
                </ng-template>
              </ng-container>
            </td>
            <td class="col-phone">
              {{ u.telefono || '—' }}
            </td>
            <td class="col-status">
              <p-tag [value]="u.activo ? 'ACTIVO' : 'INACTIVO'" [severity]="u.activo ? 'success' : 'danger'"></p-tag>
            </td>
            <td class="col-actions">
              <div class="actions">
                <!-- Gestionar usuario -->
                <button pButton type="button"
                        icon="pi pi-cog"
                        class="p-button p-button-text p-button-sm p-button-rounded btn-icon"
                        [routerLink]="['/gestion-de-usuarios/gestionar-usuario']"
                        [queryParams]="{ id: u.id }"
                        pTooltip="Gestionar" tooltipPosition="top"></button>
                <!-- Cambiar estado (activar/desactivar) -->
                <button pButton type="button"
                        class="state-button p-button-sm p-button-rounded btn-icon"
                        [ngClass]="u.activo ? 'p-button-outlined p-button-danger' : 'p-button-outlined p-button-success'"
                        [icon]="u.activo ? 'pi pi-ban' : 'pi pi-check'"
                        (click)="toggle(u)"
                        pTooltip="Cambiar estado" tooltipPosition="top"></button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="6" class="text-muted" style="text-align:center;">Sin usuarios para mostrar.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>
