<p-card header="Asignar vehículo a sección" styleClass="mb-3">
  <div *ngIf="loading" class="loading"><p-progressSpinner></p-progressSpinner></div>

  <!-- Modo selección: no hay id, mostrar listado para elegir vehículo -->
  <ng-container *ngIf="!loading && selectionMode">
    <div class="form-grid">
      <div class="form-row">
        <label for="filtroPlaca">Buscar por placa</label>
        <input id="filtroPlaca" type="text" pInputText [(ngModel)]="filterPlaca" placeholder="ABC123" />
      </div>

      <p-table [value]="vehicles | slice:0" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,20,50]"
               [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
          <tr>
            <th>Placa</th>
            <th>Estado</th>
            <th>Sección</th>
            <th style="width: 1%"></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr *ngIf="!filterPlaca || (row.placa || '').toUpperCase().includes(filterPlaca.toUpperCase().trim())">
            <td>{{ row.placa }}</td>
            <td><p-tag [severity]="row.activo ? 'success' : 'warn'" [value]="row.activo ? 'ACTIVO' : 'INACTIVO'"></p-tag></td>
            <td>{{ getSeccionNombre(row.seccionAsignadaId) }}</td>
            <td>
              <button pButton type="button" label="Seleccionar" (click)="seleccionar(row)"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </ng-container>

  <!-- Modo asignación directa: hay entidad seleccionada -->
  <ng-container *ngIf="!loading && !selectionMode && entity as v">
    <div class="summary">
      <div class="row">
        <label>Vehículo</label>
        <span>{{ v.placa }} <p-tag [severity]="v.activo ? 'success' : 'warn'" [value]="v.activo ? 'ACTIVO' : 'INACTIVO'"></p-tag></span>
      </div>
      <div class="row">
        <label>Sección actual</label>
        <span>{{ getSeccionNombre(v.seccionAsignadaId) }}</span>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-row">
        <label for="seccion">Nueva sección</label>
        <p-dropdown id="seccion" [options]="secciones" optionLabel="nombre" optionValue="id"
                    [(ngModel)]="selectedSeccionId" [showClear]="true" placeholder="Seleccione"
                    [disabled]="saving"></p-dropdown>
        <small>Deje vacío para remover la asignación.</small>
      </div>

      <div class="actions">
        <button pButton type="button" class="p-button-text" label="Volver" (click)="volver()" [disabled]="saving"></button>
        <button pButton type="button" class="p-button-text" label="Limpiar" (click)="limpiar()" [disabled]="saving"></button>
        <button pButton type="button" label="Asignar" (click)="asignar()" [disabled]="saving"></button>
      </div>
    </div>
  </ng-container>
</p-card>
