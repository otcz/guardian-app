<p-card header="Mis vehículos" styleClass="mb-3">
  <div class="actions mb-2">
    <button pButton label="Crear vehículo" icon="pi pi-plus" routerLink="/gestion-de-vehiculos/crear-vehiculo"></button>
  </div>

  <p-table [value]="items" [loading]="loading" dataKey="id" [rows]="10" [paginator]="true" [rowsPerPageOptions]="[10,20,50]">
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 14rem">Placa</th>
        <th style="width: 12rem">Estado</th>
        <th>Sección</th>
        <th style="width: 10rem">Bloqueado</th>
        <th style="width: 10rem">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ row.placa }}</td>
        <td>
          <p-inputSwitch [(ngModel)]="row.activo"
                         (onChange)="toggle(row, $event.checked)"
                         [disabled]="savingId === row.id"
                         [ngModelOptions]="{standalone: true}"></p-inputSwitch>
        </td>
        <td>{{ seccionNombre(row.seccionAsignadaId) }}</td>
        <td>
          <p-tag [severity]="row.bloqueado ? 'danger' : 'success'"
                 [value]="row.bloqueado ? 'BLOQUEADO' : 'LIBRE'"></p-tag>
        </td>
        <td>
          <div class="actions">
            <button pButton type="button" class="p-button-text" icon="pi pi-pencil" (click)="gestionar(row)"
                    pTooltip="Gestionar" tooltipPosition="top" aria-label="Gestionar"></button>
            <button pButton type="button" class="p-button-text" icon="pi pi-sitemap" (click)="asignar(row)"
                    pTooltip="Asignar sección" tooltipPosition="top" aria-label="Asignar sección"></button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
