<div class="page-container">
  <p-card styleClass="modern-card mb-3">
    <!-- Header personalizado -->
    <div class="card-header">
      <div class="header-content">
        <i class="pi pi-car header-icon"></i>
        <div class="header-text">
          <h2>Mis Vehículos</h2>
          <p class="subtitle">
            <i class="pi pi-info-circle"></i>
            Gestiona y administra tus vehículos registrados
          </p>
        </div>
      </div>
    </div>

    <!-- Cuerpo de la tarjeta -->
    <div class="card-body">
      <!-- Acciones superiores -->
      <div class="top-actions">
        <div class="info-section">
          <i class="pi pi-list"></i>
          <span class="total-count">Total: <strong>{{ items.length || 0 }}</strong> vehículos</span>
        </div>
        <button pButton
                label="Crear Vehículo"
                icon="pi pi-plus"
                class="create-btn"
                routerLink="/gestion-de-vehiculos/crear-vehiculo"></button>
      </div>

      <!-- Tabla de vehículos -->
      <p-table [value]="items"
               [loading]="loading"
               dataKey="id"
               [rows]="10"
               [paginator]="true"
               [rowsPerPageOptions]="[10,20,50]"
               styleClass="modern-table"
               [showCurrentPageReport]="true"
               currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} vehículos">
        <ng-template pTemplate="header">
          <tr>
            <th>
              <div class="th-content">
                <i class="pi pi-id-card"></i>
                <span>Placa</span>
              </div>
            </th>
            <th>
              <div class="th-content">
                <i class="pi pi-car"></i>
                <span>Marca/Modelo</span>
              </div>
            </th>
            <th>
              <div class="th-content">
                <i class="pi pi-building"></i>
                <span>Sección</span>
              </div>
            </th>
            <th>
              <div class="th-content">
                <i class="pi pi-users"></i>
                <span>Usuarios</span>
              </div>
            </th>
            <th style="width: 10rem">
              <div class="th-content">
                <i class="pi pi-power-off"></i>
                <span>Estado</span>
              </div>
            </th>
            <th style="width: 12rem" *ngIf="canToggleBloqueado()">
              <div class="th-content">
                <i class="pi pi-lock"></i>
                <span>Bloqueo</span>
              </div>
            </th>
            <th style="width: 10rem">
              <div class="th-content">
                <i class="pi pi-cog"></i>
                <span>Acciones</span>
              </div>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            <td>
              <div class="placa-cell">
                <i class="pi pi-car"></i>
                <strong>{{ row.placa }}</strong>
              </div>
            </td>
            <td>
              <div class="marca-modelo-cell">
                <span>{{ row.marca || '-' }}</span>
                <span *ngIf="row.modelo"> / {{ row.modelo }}</span>
              </div>
            </td>
            <td>
              <div class="seccion-cell">
                <p-tag *ngIf="row.seccionNombre"
                       [value]="row.seccionNombre"
                       severity="info"
                       [pTooltip]="row.seccionNombre"></p-tag>
                <span *ngIf="!row.seccionNombre" class="text-muted">Sin sección</span>
              </div>
            </td>
            <td>
              <div class="usuarios-cell">
                <p-tag *ngFor="let usuario of (row.usuariosAsignados || []).slice(0, 3)"
                       [value]="usuario"
                       severity="success"
                       styleClass="mr-1"
                       [pTooltip]="usuario"></p-tag>
                <p-tag *ngIf="(row.cantidadUsuarios || 0) > 3"
                       [value]="'+' + ((row.cantidadUsuarios || 0) - 3) + ' más'"
                       severity="warn"
                       [pTooltip]="'Total: ' + (row.cantidadUsuarios || 0) + ' usuarios'"></p-tag>
                <span *ngIf="!row.usuariosAsignados || row.usuariosAsignados.length === 0" class="text-muted">Sin usuarios</span>
              </div>
            </td>
            <td>
              <div class="estado-cell">
                <p-inputSwitch [(ngModel)]="row.activo"
                               (onChange)="toggle(row, $event.checked)"
                               [disabled]="savingId === row.id"
                               [ngModelOptions]="{standalone: true}"></p-inputSwitch>
              </div>
            </td>
            <td *ngIf="canToggleBloqueado()">
              <div class="bloqueo-cell">
                <p-tag [severity]="row.bloqueado ? 'danger' : 'success'"
                       [value]="row.bloqueado ? 'BLOQUEADO' : 'LIBRE'"
                       [icon]="row.bloqueado ? 'pi pi-lock' : 'pi pi-unlock'"
                       (click)="toggleBloqueado(row)"
                       [style.cursor]="'pointer'"
                       [pTooltip]="'Click para ' + (row.bloqueado ? 'desbloquear' : 'bloquear')"></p-tag>
              </div>
            </td>
            <td>
              <div class="acciones-cell">
                <button pButton
                        icon="pi pi-pencil"
                        class="p-button-rounded p-button-text"
                        pTooltip="Gestionar"
                        tooltipPosition="left"
                        (click)="gestionar(row)"></button>
                <button pButton
                        icon="pi pi-sitemap"
                        class="p-button-rounded p-button-text"
                        pTooltip="Asignar sección"
                        tooltipPosition="left"
                        (click)="asignar(row)"></button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <i class="pi pi-inbox"></i>
                <p>No tienes vehículos registrados</p>
                <button pButton
                        label="Crear tu primer vehículo"
                        icon="pi pi-plus"
                        class="p-button-sm"
                        routerLink="/gestion-de-vehiculos/crear-vehiculo"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>
