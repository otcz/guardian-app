<div class="page-container">
  <p-card styleClass="modern-card mb-3">
    <!-- Header personalizado -->
    <div class="card-header">
      <div class="header-content">
        <i class="pi pi-car header-icon"></i>
        <div class="header-text">
          <h2>Mis Vehículos</h2>
          <p class="subtitle">
            <i class="pi pi-info-circle"></i>
            Gestiona y administra tus vehículos registrados
          </p>
        </div>
      </div>
    </div>

    <!-- Cuerpo de la tarjeta -->
    <div class="card-body">
      <!-- Información estadística -->
      <div class="stats-info">
        <div class="stat-item">
          <i class="pi pi-car"></i>
          <span>Mostrando <strong>{{ items.length || 0 }}</strong> vehículo(s)</span>
        </div>
      </div>

      <!-- Tabla de vehículos -->
      <p-table [value]="items"
               [loading]="loading"
               dataKey="id"
               [rows]="10"
               [paginator]="true"
               [rowsPerPageOptions]="[10,20,50]"
               styleClass="p-datatable-striped"
               responsiveLayout="scroll"
               [showCurrentPageReport]="true"
               currentPageReportTemplate="Mostrando {first}-{last} de {totalRecords} vehículos">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="placa" style="min-width: 150px">
              <div class="th-content">
                <i class="pi pi-id-card"></i>
                <span>Placa</span>
              </div>
              <p-sortIcon field="placa"></p-sortIcon>
            </th>
            <th pSortableColumn="marca" style="min-width: 180px">
              <div class="th-content">
                <i class="pi pi-car"></i>
                <span>Marca/Modelo</span>
              </div>
              <p-sortIcon field="marca"></p-sortIcon>
            </th>
            <th pSortableColumn="seccionNombre" style="min-width: 180px">
              <div class="th-content">
                <i class="pi pi-building"></i>
                <span>Sección</span>
              </div>
              <p-sortIcon field="seccionNombre"></p-sortIcon>
            </th>
            <th style="min-width: 200px">
              <div class="th-content">
                <i class="pi pi-users"></i>
                <span>Usuarios Asignados</span>
              </div>
            </th>
            <th pSortableColumn="activo" style="min-width: 120px; text-align: center">
              <div class="th-content">
                <i class="pi pi-power-off"></i>
                <span>Estado</span>
              </div>
              <p-sortIcon field="activo"></p-sortIcon>
            </th>
            <th pSortableColumn="bloqueado" style="min-width: 120px; text-align: center" *ngIf="canToggleBloqueado()">
              <div class="th-content">
                <i class="pi pi-lock"></i>
                <span>Bloqueo</span>
              </div>
              <p-sortIcon field="bloqueado"></p-sortIcon>
            </th>
            <th style="width: 140px; text-align: center">
              <div class="th-content">
                <i class="pi pi-cog"></i>
                <span>Acciones</span>
              </div>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-vehiculo>
          <tr>
            <!-- Placa con chip -->
            <td>
              <p-chip
                icon="pi pi-car"
                [label]="vehiculo.placa"
                styleClass="placa-chip"
              ></p-chip>
            </td>

            <!-- Marca/Modelo -->
            <td>
              <div class="marca-modelo-info">
                <span class="marca">{{ vehiculo.marca || '—' }}</span>
                <span class="modelo" *ngIf="vehiculo.modelo">{{ vehiculo.modelo }}</span>
              </div>
            </td>

            <!-- Sección -->
            <td>
              <p-chip
                *ngIf="vehiculo.seccionNombre"
                icon="pi pi-sitemap"
                [label]="vehiculo.seccionNombre"
              ></p-chip>
              <span *ngIf="!vehiculo.seccionNombre" class="text-muted">
                <i class="pi pi-minus-circle"></i> Sin sección
              </span>
            </td>

            <!-- Usuarios con tooltip -->
            <td>
              <div class="usuarios-container">
                <ng-container *ngIf="vehiculo.usuariosAsignados && vehiculo.usuariosAsignados.length > 0; else noUsers">
                  <p-tag
                    *ngFor="let usuario of getVisibleUsers(vehiculo)"
                    [value]="usuario"
                    severity="success"
                    styleClass="user-tag"
                  ></p-tag>
                  <p-button
                    *ngIf="getRemainingUsersCount(vehiculo) > 0"
                    [label]="'+' + getRemainingUsersCount(vehiculo)"
                    [text]="true"
                    [rounded]="true"
                    size="small"
                    [pTooltip]="getAllUsersTooltip(vehiculo)"
                    [escape]="false"
                    tooltipPosition="top"
                  ></p-button>
                </ng-container>
                <ng-template #noUsers>
                  <span class="text-muted">
                    <i class="pi pi-user-minus"></i> Sin usuarios
                  </span>
                </ng-template>
              </div>
            </td>

            <!-- Estado -->
            <td style="text-align: center">
              <p-tag
                [value]="vehiculo.activo ? 'ACTIVO' : 'INACTIVO'"
                [severity]="vehiculo.activo ? 'success' : 'danger'"
              ></p-tag>
            </td>

            <!-- Bloqueo -->
            <td style="text-align: center" *ngIf="canToggleBloqueado()">
              <p-tag
                [severity]="vehiculo.bloqueado ? 'danger' : 'success'"
                [value]="vehiculo.bloqueado ? 'BLOQUEADO' : 'LIBRE'"
                [icon]="vehiculo.bloqueado ? 'pi pi-lock' : 'pi pi-unlock'"
                [style.cursor]="'pointer'"
                (click)="toggleBloqueado(vehiculo)"
                [pTooltip]="'Click para ' + (vehiculo.bloqueado ? 'desbloquear' : 'bloquear')"
              ></p-tag>
            </td>

            <!-- Acciones -->
            <td>
              <div class="action-buttons">
                <p-button
                  icon="pi pi-pencil"
                  [rounded]="true"
                  [text]="true"
                  (onClick)="gestionar(vehiculo)"
                  pTooltip="Gestionar vehículo"
                  tooltipPosition="top"
                ></p-button>
                <p-button
                  icon="pi pi-sitemap"
                  [rounded]="true"
                  [text]="true"
                  (onClick)="asignar(vehiculo)"
                  pTooltip="Asignar sección"
                  tooltipPosition="top"
                ></p-button>
                <p-button
                  [icon]="vehiculo.activo ? 'pi pi-ban' : 'pi pi-check'"
                  [rounded]="true"
                  [text]="true"
                  [severity]="vehiculo.activo ? 'danger' : 'success'"
                  (onClick)="toggle(vehiculo, !vehiculo.activo)"
                  [pTooltip]="vehiculo.activo ? 'Desactivar' : 'Activar'"
                  tooltipPosition="top"
                ></p-button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td [attr.colspan]="canToggleBloqueado() ? 7 : 6" class="empty-message">
              <i class="pi pi-inbox"></i>
              <span>No hay vehículos registrados</span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>
</div>
