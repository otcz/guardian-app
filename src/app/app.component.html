<ng-container *ngIf="isAuthScreen; else mainLayout">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #mainLayout>
  <div class="app-layout">
    <!-- Overlay para cerrar sidebar en móvil -->
    <div class="sidebar-overlay"
         *ngIf="sidebarOpen && isMobileView"
         (click)="closeSidebar()"
         @fadeInOut>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar"
           [class.sidebar-expanded]="sidebarOpen"
           [class.sidebar-collapsed]="!sidebarOpen && !isMobileView"
           [class.sidebar-hidden]="!sidebarOpen && isMobileView"
           [class.sidebar-mobile]="isMobileView">

      <!-- Header del Sidebar -->
      <div class="sidebar-header">
        <!-- Logo Expandido -->
        <div class="sidebar-logo" *ngIf="sidebarOpen">
          <img src="assets/logo_guardian_64px.png" alt="Guardian" class="logo-img" />
          <span class="logo-text">Guardian</span>
        </div>

        <!-- Logo Mini (Colapsado) -->
        <div class="sidebar-logo-mini" *ngIf="!sidebarOpen && !isMobileView">
          <img src="assets/logo_guardian_64px.png" alt="Guardian" class="logo-img-mini" />
        </div>

        <!-- Botón Toggle -->
        <button pButton
                type="button"
                class="sidebar-toggle-btn"
                (click)="toggleSidebar()"
                [icon]="sidebarOpen ? 'pi pi-angle-left' : 'pi pi-angle-right'"
                [pTooltip]="sidebarOpen ? 'Colapsar menú' : 'Expandir menú'"
                tooltipPosition="right"
                [ngClass]="{'collapsed-btn': !sidebarOpen}">
        </button>
      </div>

      <!-- Content del Sidebar -->
      <div class="sidebar-content">
        <!-- Buscador (solo expandido) -->
        <div class="sidebar-search" *ngIf="sidebarOpen">
          <span class="p-input-icon-left">
            <i class="pi pi-search"></i>
            <input pInputText
                   type="text"
                   placeholder="Buscar en el menú..."
                   [(ngModel)]="searchQuery"
                   (ngModelChange)="onSearchChange($event)"
                   class="search-input"/>
          </span>
          <div class="search-actions">
            <button pButton
                    type="button"
                    icon="pi pi-plus"
                    class="p-button-text p-button-sm"
                    (click)="expandAll()"
                    pTooltip="Expandir todo"
                    tooltipPosition="bottom">
            </button>
            <button pButton
                    type="button"
                    icon="pi pi-minus"
                    class="p-button-text p-button-sm"
                    (click)="collapseAll()"
                    pTooltip="Colapsar todo"
                    tooltipPosition="bottom">
            </button>
          </div>
        </div>

        <!-- Link de Inicio -->
        <a routerLink="/"
           class="menu-link home-link"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: true}"
           (click)="onMobileMenuClick()"
           [pTooltip]="!sidebarOpen ? 'Inicio' : ''"
           tooltipPosition="right">
          <i class="pi pi-home"></i>
          <span *ngIf="sidebarOpen">Inicio</span>
        </a>

        <div class="menu-divider"></div>

        <!-- Menús -->
        <div class="sidebar-menus">
          <ng-container *ngIf="(filteredMenus$ | async) as menus">
            <!-- Vista Expandida -->
            <div *ngIf="sidebarOpen">
              <div *ngFor="let menu of menus; trackBy: trackByMenuKey" class="menu-group">
                <div class="menu-header"
                     (click)="toggleMenu(menu.key)"
                     [class.expanded]="isExpanded(menu.key)">
                  <div class="menu-header-left">
                    <i class="chevron-icon pi"
                       [ngClass]="isExpanded(menu.key) ? 'pi-chevron-down' : 'pi-chevron-right'">
                    </i>
                    <i class="menu-icon" [ngClass]="menu.icon || 'pi pi-folder'"></i>
                    <span class="menu-title">{{ menu.label }}</span>
                  </div>
                  <span *ngIf="menu.children?.length" class="menu-badge">
                    {{ menu.children?.length }}
                  </span>
                </div>

                <div class="menu-items"
                     *ngIf="isExpanded(menu.key)"
                     @slideDown>
                  <a *ngFor="let child of menu.children; trackBy: trackByChildLabel"
                     [routerLink]="(child.path || '').split('?')[0]"
                     [queryParams]="parseQuery(child.path)"
                     class="menu-item"
                     routerLinkActive="active"
                     (click)="onMobileMenuClick()">
                    <i class="item-icon" [ngClass]="child.icon || 'pi pi-circle'"></i>
                    <span class="item-label">{{ child.label }}</span>
                  </a>
                </div>
              </div>
            </div>

            <!-- Vista Colapsada (Solo Iconos) -->
            <div *ngIf="!sidebarOpen && !isMobileView" class="menu-icons-only">
              <div *ngFor="let menu of menus; trackBy: trackByMenuKey" class="menu-icon-group">
                <div class="menu-icon-item"
                     [pTooltip]="menu.label + ' (' + (menu.children?.length || 0) + ')'"
                     tooltipPosition="right"
                     (click)="expandSidebarAndOpenMenu(menu.key)">
                  <i [ngClass]="menu.icon || 'pi pi-folder'"></i>
                </div>
              </div>
            </div>

            <div *ngIf="menus.length === 0" class="no-results">
              <i class="pi pi-search"></i>
              <p>Sin resultados</p>
              <small>Intenta con otro término</small>
            </div>
          </ng-container>
        </div>
      </div>

      <!-- Footer del Sidebar -->
      <div class="sidebar-footer">
        <div class="footer-info" *ngIf="sidebarOpen">
          <i class="pi pi-info-circle"></i>
          <span>Versión 1.0.0</span>
        </div>
        <div class="footer-info-mini" *ngIf="!sidebarOpen && !isMobileView"
             pTooltip="Versión 1.0.0"
             tooltipPosition="right">
          <i class="pi pi-info-circle"></i>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <img src="assets/logo.png" alt="Guardian Logo" class="header-logo" />
        </div>

        <div class="header-right">
          <button pButton
                  type="button"
                  icon="pi pi-bell"
                  class="p-button-text p-button-rounded notification-btn"
                  aria-label="Notificaciones"
                  pBadge
                  value="3"
                  severity="danger">
          </button>
          <app-user-avatar-pro></app-user-avatar-pro>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="app-main">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <div class="theme-fab">
    <app-theme-toggle mode="cycle"></app-theme-toggle>
  </div>

  <app-feedback-center></app-feedback-center>
</ng-template>
