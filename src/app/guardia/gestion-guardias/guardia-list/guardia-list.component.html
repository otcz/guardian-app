<div class="card">
  <div class="card-header">
    <h2>Gestión de Guardias</h2>
    <p-button
      [label]="LABELS.BTN_NUEVA_GUARDIA"
      icon="pi pi-plus"
      (onClick)="nuevaGuardia()"
      styleClass="p-button-success"
    ></p-button>
  </div>

  <!-- Filtros -->
  <div class="filtros-container">
    <div class="p-fluid p-formgrid p-grid">
      <div class="p-field p-col-12 p-md-3">
        <label for="filtroSeccion">Sección</label>
        <p-dropdown
          id="filtroSeccion"
          [(ngModel)]="filtroSeccion"
          [options]="secciones"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Todas las secciones"
          [showClear]="true"
          (onChange)="onFiltroChange()"
        ></p-dropdown>
      </div>

      <div class="p-field p-col-12 p-md-3">
        <label for="filtroEstado">Estado</label>
        <p-dropdown
          id="filtroEstado"
          [(ngModel)]="filtroEstado"
          [options]="estadoOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Todas"
          (onChange)="onFiltroChange()"
        ></p-dropdown>
      </div>

      <div class="p-field p-col-12 p-md-6">
        <label for="filtroBusqueda">Buscar</label>
        <span class="p-input-icon-left">
          <i class="pi pi-search"></i>
          <input
            id="filtroBusqueda"
            type="text"
            pInputText
            [(ngModel)]="filtroBusqueda"
            (input)="onFiltroChange()"
            placeholder="Buscar por nombre o código"
          />
        </span>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <p-table
    [value]="guardiasFiltered"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} guardias"
    styleClass="p-datatable-striped"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="codigo">
          Código <p-sortIcon field="codigo"></p-sortIcon>
        </th>
        <th pSortableColumn="nombre">
          Nombre <p-sortIcon field="nombre"></p-sortIcon>
        </th>
        <th>Sección</th>
        <th>Ubicación</th>
        <th pSortableColumn="activa">
          Estado <p-sortIcon field="activa"></p-sortIcon>
        </th>
        <th style="text-align: center">Entrada</th>
        <th style="text-align: center">Salida</th>
        <th style="text-align: center">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-guardia>
      <tr>
        <td>
          <strong>{{ guardia.codigo }}</strong>
        </td>
        <td>{{ guardia.nombre }}</td>
        <td>{{ guardia.seccionId }}</td>
        <td>{{ guardia.ubicacion || '-' }}</td>
        <td>
          <p-tag
            [value]="getEstadoLabel(guardia.activa)"
            [severity]="getSeverity(guardia.activa)"
          ></p-tag>
        </td>
        <td style="text-align: center">
          <i
            [class]="guardia.permiteEntrada ? 'pi pi-check text-success' : 'pi pi-times text-danger'"
          ></i>
        </td>
        <td style="text-align: center">
          <i
            [class]="guardia.permiteSalida ? 'pi pi-check text-success' : 'pi pi-times text-danger'"
          ></i>
        </td>
        <td style="text-align: center">
          <div class="action-buttons">
            <p-button
              icon="pi pi-eye"
              styleClass="p-button-rounded p-button-text p-button-info"
              [pTooltip]="LABELS.BTN_VER"
              (onClick)="verGuardia(guardia)"
            ></p-button>
            <p-button
              icon="pi pi-pencil"
              styleClass="p-button-rounded p-button-text p-button-warning"
              [pTooltip]="LABELS.BTN_EDITAR"
              (onClick)="editarGuardia(guardia)"
            ></p-button>
            <p-button
              [icon]="guardia.activa ? 'pi pi-ban' : 'pi pi-check'"
              [styleClass]="guardia.activa ? 'p-button-rounded p-button-text p-button-secondary' : 'p-button-rounded p-button-text p-button-success'"
              [pTooltip]="guardia.activa ? LABELS.BTN_DESACTIVAR : LABELS.BTN_ACTIVAR"
              (onClick)="toggleActivar(guardia)"
            ></p-button>
            <p-button
              icon="pi pi-trash"
              styleClass="p-button-rounded p-button-text p-button-danger"
              [pTooltip]="LABELS.BTN_ELIMINAR"
              (onClick)="eliminarGuardia(guardia)"
            ></p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" style="text-align: center">No se encontraron guardias</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-confirmDialog></p-confirmDialog>
